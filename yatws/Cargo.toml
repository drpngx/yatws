[package]
name = "yatws"
version = "0.1.7"
edition = "2024"
authors = ["Patrick Nguyen <pub+yatws@drpng.com>"]
description = "Yet Another TWS (Interactive Brokers TWS API) Implementation"
license = "MIT"
repository = "https://github.com/drpngx/yatws"
readme = "README.md"
keywords = ["finance", "trading", "interactive-brokers", "tws", "ibkr"]
categories = ["api-bindings", "finance"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bincode = "2.0.1"
bitmask-enum = "2.2.5"
byteorder = "1.5.0"
chrono = { version = "0.4.44", features = ["std", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
env_logger = "0.11.10"
futures = "0.3.32"
glob = "0.3.3"
inventory = "0.3.24"
lazy_static = "1.5.0"
log = "0.4.29"
num_enum = "0.7.6"
num-traits = "0.2.19"
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.9.4"
rusqlite = { version = "0.37.0", optional = true, features = ["vtab", "functions", "window", "blob", "bundled", "rusqlite-macros"] }
rust_decimal = "1.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
socket2 = { version = "0.6.3", features = ["all"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["macros", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.52.0", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
suppaftp = { version = "7.1.0" }
csv = { version = "1.4.0" }

[dev-dependencies]
tokio-test = "0.4.5"
mockall = "0.14.0"
serial_test = "3.4.0"
tempfile = "3.27.0"

[features]
default = ["log-sql"]
# Connection logging backends. Note: Cargo features are additive; pass `default-features = false`
# when selecting `log-txt` or `log-none` if you want to omit the `rusqlite` dependency.
log-sql = ["dep:rusqlite"]
log-txt = []
log-none = []
# shortinv = ["dep:suppaftp", "dep:csv"]
shortinv = []

[lib]
name = "yatws"

[[bin]]
name = "tws_snoop"
path = "tws_snoop.rs"

[[bin]]
name = "gen_goldens"
path = "gen_goldens.rs"
required-features = ["shortinv"]
